services:
  ocr-web:
    build: .
    restart: unless-stopped
    ports:
      - "5099:8000"
    environment:
      OCR_MAX_UPLOAD_BYTES: "10485760"
      OCR_MAX_PAGES: "3"
      OCR_MAX_PIXELS: "20000000"
      OCR_MAX_MODELS_PER_REQUEST: "2"
      OCR_QUEUE_WAIT_SECONDS: "5"
      OCR_INFERENCE_TIMEOUT_SECONDS: "60"
      OCR_REQUESTS_PER_MINUTE: "5"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3


